<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memphis Pub — Assistente</title>
<style>
:root{--bg:#111;--card:#1b1b1b;--line:#333;--text:#eee;--muted:#aaa;--me:#3a3a3a;--bot:#232323;--accent:#e0a526}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
main{max-width:720px;margin:auto;padding:16px;min-height:100vh;display:flex;flex-direction:column}
header{padding:8px 0 14px}
header b{font-size:1.2rem}
header small{color:var(--muted);display:block;margin-top:4px}
.chat{flex:1;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:50vh}
.msg{max-width:85%;padding:10px 12px;margin:6px 0;border-radius:14px;white-space:pre-wrap;line-height:1.4}
.u{background:var(--me);margin-left:auto;border-bottom-right-radius:4px}
.a{background:var(--bot);border-bottom-left-radius:4px}
.typing{color:var(--muted);font-style:italic}
form{display:flex;gap:8px;margin-top:10px}
input{flex:1;min-width:0;padding:13px;border-radius:10px;border:1px solid #444;background:#0c0c0c;color:#fff;font-size:16px}
button{padding:12px 16px;border:0;border-radius:10px;background:var(--accent);color:#111;font-weight:600;cursor:pointer}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{background:#2a2a2a;color:var(--text);font-weight:400;padding:8px 10px}
footer{color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<main>
<header><b>Memphis Pub · Bernalda</b><small>Assistente virtuale: prenotazioni, asporto, domicilio e menu</small></header>
<div id="chat" class="chat" aria-live="polite"></div>
<div class="quick">
  <button type="button" data-q="Vorrei prenotare un tavolo">Prenota un tavolo</button>
  <button type="button" data-q="Vorrei ordinare da asporto">Ordina da asporto</button>
  <button type="button" data-q="Vorrei ordinare a domicilio">Ordina a domicilio</button>
  <button type="button" data-q="Cosa c'è nel menu?">Menu</button>
</div>
<form id="f"><input id="q" autocomplete="off" placeholder="Scrivi un messaggio…"><button>Invia</button></form>
<footer>Stai parlando con un assistente virtuale. Prenotazioni e ordini sono confermati solo dopo la verifica del locale.</footer>
</main>
<script>
const chat=document.getElementById('chat'),q=document.getElementById('q');
let sid;
try{sid=sessionStorage.getItem('memphis_sid')}catch(e){}
if(!sid){sid='web-'+Math.random().toString(36).slice(2)+Date.now().toString(36);try{sessionStorage.setItem('memphis_sid',sid)}catch(e){}}
function add(t,k){const d=document.createElement('div');d.className='msg '+k;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
add("Ciao! Sono l'assistente virtuale del Memphis Pub. Posso aiutarti a prenotare un tavolo, ordinare da asporto o a domicilio, o darti informazioni sul menu.","a");
let busy=false;
async function send(m){
  m=(m||'').trim(); if(!m||busy)return; busy=true;
  add(m,'u'); q.value='';
  const t=add('sto scrivendo…','a typing');
  try{
    const r=await fetch('/api/conversation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,message:m})});
    const j=await r.json(); t.remove(); add(j.reply||'Scusa, riprova tra poco.','a');
  }catch(e){t.remove();add('Connessione non riuscita, riprova.','a')}
  busy=false; q.focus();
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();send(q.value)});
document.querySelectorAll('.quick button').forEach(b=>b.addEventListener('click',()=>send(b.dataset.q)));
</script>
</body>
</html>
